packages:
  - apps/*

# Versions live here and nowhere else. `strict` makes pnpm reject a dependency
# added outside the catalog instead of silently pinning a second version.
catalogMode: strict

catalog:
  "@astrojs/sitemap": ^3.7.4
  "@biomejs/biome": ^2.4.15
  "@base-ui/react": ^1.7.0
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/modifiers": ^9.0.0
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  "@fontsource-variable/geist": ^5.3.0
  "@phosphor-icons/react": ^2.1.10
  "@tailwindcss/vite": ^4.3.3
  "@tauri-apps/api": ^2.11.1
  "@tauri-apps/cli": ^2.11.4
  "@tauri-apps/plugin-clipboard-manager": ^2.3.2
  "@tauri-apps/plugin-opener": ^2.5.0
  "@astrojs/check": ^0.9.4
  "@types/node": ^26.4.0
  "@types/react": ^19.1.8
  "@types/react-dom": ^19.1.6
  "@types/semver": ^7.5.8
  "@vitejs/plugin-react": ^4.6.0
  astro: ^5.4.2
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  react: ^19.1.0
  react-dom: ^19.1.0
  lefthook: ^2.1.10
  repojj: ^2026.1.35
  semver: ^7.7.1
  shadcn: ^4.19.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ~5.8.3
  vite: ^7.0.4

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  # Astro depends on sharp whether or not the site uses astro:assets. pnpm
  # fails the install outright without this.
  sharp: true
  # lefthook's binary ships via optionalDependencies; its postinstall only runs
  # `lefthook install`, which the root prepare script already does.
  lefthook: false
