packages:
  - apps/*
  - packages/*

autoInstallPeers: true
strictPeerDependencies: false

# Refuse to resolve any version younger than a week. Explicit on purpose:
# under pnpm's implicit default a too-young version is allowlisted and installed anyway.
minimumReleaseAge: 10080

# Versions live here and nowhere else. `strict` makes pnpm reject a dependency
# added outside a catalog instead of silently pinning a second version.
catalogMode: strict
cleanupUnusedCatalogs: true

# One @types/node across the tree, whatever a dependency asks for.
overrides:
  "@types/node": "catalog:"

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  # lefthook's binary ships via optionalDependencies; its postinstall only runs
  # `lefthook install`, which the root prepare script already does.
  lefthook: false
  # Astro depends on sharp, which loads its prebuilt binary without the install
  # script. The site never processes images.
  sharp: false

catalog:
  "@astrojs/check": ^0.9.10
  "@astrojs/react": ^6.0.5
  "@astrojs/sitemap": ^3.7.4
  "@base-ui/react": ^1.8.0
  "@biomejs/biome": ^2.5.13
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/modifiers": ^9.0.0
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  "@fontsource-variable/bricolage-grotesque": ^5.3.0
  "@fontsource-variable/geist": ^5.3.0
  "@phosphor-icons/react": ^2.1.10
  "@tailwindcss/vite": ^4.3.3
  "@tauri-apps/api": ^2.11.1
  "@tauri-apps/cli": ^2.11.4
  "@tauri-apps/plugin-clipboard-manager": ^2.3.2
  "@tauri-apps/plugin-opener": ^2.5.0
  "@types/node": ^24.13.4
  "@types/semver": ^7.5.8
  "@varlock/1password-plugin": ^2.0.4
  "@vitejs/plugin-react": ^6.1.1
  astro: ^7.3.2
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lefthook: ^2.1.14
  repojj: ^2026.7.29
  semver: ^7.7.1
  shadcn: ^4.19.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ~7.0.2
  varlock: ^1.19.0
  vite: ^8.3.0
  vitest: ^5.0.1

catalogs:
  # `astro check` loads the compiler in-process, and TypeScript 7 ships no JS
  # compiler API until 7.1. Only the site takes 6, under the `typescript` name
  # its @astrojs/check peer resolves to.
  ts6:
    typescript: npm:@typescript/typescript6@~6.0.2
  web:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: ^19.3.0
    react-dom: ^19.3.0
