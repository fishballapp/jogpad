packages:
  - apps/*
  - packages/*

# Versions live here and nowhere else. `strict` makes pnpm reject a dependency
# added outside the catalog instead of silently pinning a second version.
catalogMode: strict

# Refuse to resolve any version younger than a week, as fishballapps does. Explicit on purpose:
# under pnpm's implicit default a too-young version is allowlisted and installed anyway.
minimumReleaseAge: 10080

catalog:
  "@astrojs/react": ^6.0.5
  "@astrojs/sitemap": ^3.7.4
  "@biomejs/biome": ^2.5.13
  "@base-ui/react": ^1.8.0
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/modifiers": ^9.0.0
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  "@fontsource-variable/bricolage-grotesque": ^5.3.0
  "@fontsource-variable/geist": ^5.3.0
  "@phosphor-icons/react": ^2.1.10
  "@tailwindcss/vite": ^4.3.3
  "@tauri-apps/api": ^2.11.1
  "@tauri-apps/cli": ^2.11.4
  "@tauri-apps/plugin-clipboard-manager": ^2.3.2
  "@tauri-apps/plugin-opener": ^2.5.0
  "@astrojs/check": ^0.9.10
  "@types/node": ^24.13.4
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/semver": ^7.5.8
  "@vitejs/plugin-react": ^6.1.1
  astro: ^7.3.2
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  react: ^19.3.0
  react-dom: ^19.3.0
  lefthook: ^2.1.14
  repojj: ^2026.7.29
  semver: ^7.7.1
  shadcn: ^4.19.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ~6.0.3
  vite: ^8.3.0
  vitest: ^5.0.1

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  # Astro depends on sharp whether or not the site uses astro:assets. pnpm
  # fails the install outright without this.
  sharp: true
  # lefthook's binary ships via optionalDependencies; its postinstall only runs
  # `lefthook install`, which the root prepare script already does.
  lefthook: false
