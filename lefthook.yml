pre-commit:
  parallel: true
  jobs:
    - name: repojj
      run: pnpm repojj:check
    - name: biome
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      glob: "*.{js,jsx,ts,tsx,cts,mts,json,jsonc,css}"
      stage_fixed: true
    - name: typecheck
      run: pnpm typecheck
    # Formats the whole crate, so this only reports. Run `cargo fmt` yourself.
    - name: cargo-fmt
      run: pnpm -F @jogpad/desktop rust:fmt
      glob: "*.rs"
