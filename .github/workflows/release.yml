name: release

# Tag a version to cut a release: git tag v0.1.0 && git push --tags
# The DMG lands on a draft release, so nothing goes public until you say so.
#
# Every push to main also builds a dev release, published straight away and
# served to the Dev update channel. Its version is package.json's with
# `.dev.<commit count>` appended, which sorts above the beta it came from and
# below the next one. Only the newest three are kept.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

# A newer push to main makes the dev build still running pointless. Tags are
# each their own group and are never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    # DMGs need hdiutil, codesign and the AppleScript that styles the mount
    # window. None of that exists off macOS. Free for public repos.
    runs-on: macos-latest
    permissions:
      contents: write
      # To redeploy the site after a dev release. GITHUB_TOKEN publishing a
      # release does not fire the release event, so the site is asked directly.
      actions: write

    steps:
      - uses: actions/checkout@v5
        with:
          # The dev version counts commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal binary means one download that runs on both Apple
          # silicon and Intel, rather than asking people which Mac they have.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: astro check
        run: pnpm check:astro

      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Dev builds get their version from package.json plus the commit count,
      # written into tauri.conf.json, which is where both Tauri and
      # tauri-action read it. Nothing is committed.
      - name: Version the dev build
        if: github.ref_type == 'branch'
        id: dev
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          COUNT=$(git rev-list --count HEAD)
          BASE="${PKG%%+*}"
          if [[ "$BASE" == *-* ]]; then
            VERSION="$BASE.dev.$COUNT"
          else
            # After a stable release the next build must still sort above it,
            # yet below whatever -beta.1 follows. A leading numeric prerelease
            # identifier sorts before any alphabetic one, so this does both.
            IFS=. read -r MAJ MIN PAT <<< "$BASE"
            VERSION="$MAJ.$MIN.$((PAT + 1))-0.dev.$COUNT"
          fi
          echo "dev version $VERSION"
          node -e '
            const fs = require("fs");
            const p = "apps/desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          ' "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Any SemVer prerelease, not just -beta. An -rc or -alpha tag marked as a
      # normal release would be served to every stable client.
      - name: Check prerelease tag
        if: github.ref_type == 'tag'
        id: flags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: tag $TAG is not a SemVer version tag" >&2
            exit 1
          fi
          # tauri-action names the release from package.json, while the
          # prerelease flag below comes from the tag. If they disagree, a beta
          # tag can publish a plain stable release to everyone.
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$PKG" != "${TAG#v}" ]; then
            echo "Error: tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

          # Strip build metadata first, or a dash inside +build reads as a
          # prerelease.
          VERSION="${TAG#v}"
          if [[ "${VERSION%%+*}" == *-* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      # Notes come from CHANGELOG.md, so they are reviewed in the commit that
      # ships them rather than typed into a web form afterwards. This runs
      # before the build: a missing section should cost seconds, not a
      # notarisation round trip.
      - name: Collect release notes
        id: notes
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.dev.outputs.version) }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            {
              echo 'body<<RELEASE_NOTES_EOF'
              echo "Dev build of main at ${GITHUB_SHA:0:7}. Served to the Dev update channel; not for general use."
              echo
              git log -1 --format='%s%n%n%b'
              echo 'RELEASE_NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # sed drops the blank line that follows the heading.
          NOTES=$(awk -v v="## $VERSION" '$0 == v {found=1; next} /^## / && found {exit} found' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "Error: CHANGELOG.md has no '## $VERSION' section" >&2
            exit 1
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$NOTES"
            cat <<'INSTALL'

          ## Installing

          Download `JogPad_<version>_universal.dmg` below and drag JogPad to
          Applications. Runs on Apple silicon and Intel.

          On first launch, grant Accessibility access when asked. Without it
          double-tapping Shift cannot read the selection in other apps.
          INSTALL
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Apple and updater credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Validate that required updater and signing secrets are present.
          # APPLE_ID and APPLE_PASSWORD are deliberately absent: this repo
          # notarises with the App Store Connect API key, checked separately
          # below, and requiring an Apple ID here would fail every tag.
          for req in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                     APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     APPLE_TEAM_ID; do
            if [ -z "${!req}" ]; then
              echo "Error: Required secret $req is missing or empty" >&2
              exit 1
            fi
          done

          if [ -z "$APPLE_API_KEY" ] && [ -z "$APPLE_API_KEY_P8" ]; then
            echo "Error: Apple notarization API key (APPLE_API_KEY or APPLE_API_KEY_P8) is missing or empty" >&2
            exit 1
          fi

          if [ -n "$APPLE_API_KEY" ] && [ -z "$APPLE_API_ISSUER" ]; then
            echo "Error: APPLE_API_ISSUER is required when APPLE_API_KEY is set" >&2
            exit 1
          fi

          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
            fi
          done

          # The App Store Connect key is a file rather than a variable.
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          fi

          # Throwaway password for the temporary keychain on this runner.
          echo "KEYCHAIN_PASSWORD=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Dev builds skip the dmg: nobody downloads them, the updater fetches
          # the .app.tar.gz, and it saves the notarisation of a second file.
          args: --target universal-apple-darwin ${{ github.ref_type == 'branch' && '--bundles app' || '' }}
          tagName: v__VERSION__
          releaseName: JogPad v__VERSION__
          releaseDraft: true
          prerelease: ${{ github.ref_type == 'branch' || steps.flags.outputs.is_beta == 'true' }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseBody: ${{ steps.notes.outputs.body }}

      # Tauri notarises and staples the .app, then wraps it in a disk image it
      # does not notarise. Gatekeeper judges the container a browser downloaded,
      # so an unnotarised dmg is refused with "Apple cannot check it for
      # malicious software" even though the app inside is fine. Updates are
      # unaffected either way: they fetch the .app.tar.gz, never the dmg.
      - name: Notarise and staple the disk image
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DMG=$(ls apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          echo "notarising $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          # Judge it the way a downloaded copy is judged, not the way a local
          # build is. Without the quarantine flag this passes even unnotarised.
          COPY="$RUNNER_TEMP/gatekeeper-check.dmg"
          cp "$DMG" "$COPY"
          xattr -w com.apple.quarantine "0083;00000000;Safari;" "$COPY"
          spctl -a -vvv -t open --context context:primary-signature "$COPY"

          # tauri-action already attached the unnotarised one.
          gh release upload "$TAG" "$DMG" --clobber --repo "${{ github.repository }}"

      # Publishing a draft by hand is the safety net for tagged releases. Dev
      # builds are meant to flow, so they publish themselves, and the older
      # ones go so the release list stays readable. Three stay in case the
      # newest is broken and someone needs to step back.
      - name: Publish the dev build and prune older ones
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: v${{ steps.dev.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --repo "$REPO"
          # The API lists newest first, so everything after the first three
          # dev releases is old. Drafts left by cancelled runs go the same way.
          gh api "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test("\\.dev\\.[0-9]+$")) | .tag_name' \
            | { grep -v -x "$TAG" || true; } | tail -n +3 | while read -r old; do
              echo "pruning $old"
              gh release delete "$old" --cleanup-tag --yes --repo "$REPO" \
                || gh release delete "$old" --yes --repo "$REPO"
            done
          gh workflow run site.yml --repo "$REPO" --ref main
