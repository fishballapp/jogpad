name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes the running check irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The crate pulls in AppKit, CoreGraphics and IOKit, and Tauri needs a
    # webview to link against, so this cannot run on Linux even though the
    # tests themselves are platform independent.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: repojj
        run: pnpm repojj:check

      - name: biome
        run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - name: astro check
        run: pnpm -r check

      - name: Build the front end
        run: pnpm --filter @jogpad/desktop vite:build

      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @jogpad/site build

      - name: cargo fmt
        run: pnpm --filter @jogpad/desktop rust:fmt

      - name: cargo clippy
        run: pnpm --filter @jogpad/desktop rust:clippy

      - name: cargo test
        run: pnpm --filter @jogpad/desktop rust:test
