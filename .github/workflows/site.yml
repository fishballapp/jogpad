name: site

on:
  # Unpublishing or deleting a bad release has to redeploy too, or the live
  # manifest keeps pointing at assets that have stopped being downloadable.
  release:
    types: [published, unpublished, deleted, edited]
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release event runs with the tag as its ref, and the github-pages
  # environment only accepts deployments from main. Bounce back to main rather
  # than granting every tag permission to deploy: the site should always be
  # built from the branch, never from whatever the tag happened to point at.
  from-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo ${{ github.repository }} --ref main

  deploy:
    if: github.event_name != 'release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # Belt and braces: this job no longer runs on a release event, but pinning
      # the ref means a future trigger cannot quietly rebuild the site from a
      # tag's tree and revert the landing page.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @jogpad/site build

      # A build that quietly produces no manifests is indistinguishable from a
      # healthy one, and it would take updates away from everyone already
      # installed. Only tolerate their absence when no release could supply one.
      - name: Assert the manifests exist if a release can supply them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(gh api "repos/${{ github.repository }}/releases?per_page=100")
          has_manifest='select(.draft == false) | select(any(.assets[]; .name == "latest.json"))'
          is_dev='(.tag_name | test("\\.dev\\.[0-9]+$"))'
          stable=$(jq "[.[] | $has_manifest | select(.prerelease == false)] | length" <<< "$releases")
          beta=$(jq "[.[] | $has_manifest | select($is_dev | not)] | length" <<< "$releases")
          dev=$(jq "[.[] | $has_manifest] | length" <<< "$releases")
          echo "releases carrying a manifest: stable=$stable beta=$beta dev=$dev"
          for pair in "stable:latest.json" "beta:beta.json" "dev:dev.json"; do
            name=${pair%%:*}
            file=${pair#*:}
            count=${!name}
            if [ "$count" -gt 0 ] && [ ! -s "apps/site/dist/$file" ]; then
              echo "Error: a published release could serve $file but the build did not write it" >&2
              exit 1
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
